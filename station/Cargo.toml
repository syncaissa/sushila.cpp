[package]
name = "sushila-station"
version = "0.1.1"
description = "Sushila Station: the desktop app for Sushila.cpp (chat, code, pictures, music and video on your own computer)"
authors = ["Sushila, an open-source research project"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
