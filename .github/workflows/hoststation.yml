# Builds the Sushila Host Station installers for Windows, macOS (Apple silicon and Intel) and Linux.
# Copy to .github/workflows/ in the repository that contains hoststation/ (this folder). Run it from the Actions tab.
# Code signing happens when these repository secrets exist (see README.md, "Making browsers and operating systems
# trust the installer"):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID (Microsoft Trusted Signing, used by signCommand)
name: Sushila Host Station installers
on:
  workflow_dispatch:
    inputs:
      publish: { description: "upload the installers to B2 (sushila.ai offers them in the install wizard)", type: boolean, default: false }
      mac: { description: "also build the macOS installers (macOS minutes cost 10x: build them for releases only)", type: boolean, default: false }
jobs:
  plan:
    # the build list: Windows and Linux always, macOS only when asked (macOS runner minutes cost 10x)
    runs-on: ubuntu-22.04
    outputs: { matrix: "${{ steps.m.outputs.matrix }}" }
    steps:
      - id: m
        shell: python
        env: { MAC: "${{ inputs.mac }}" }
        run: |
          import json, os
          rows = [{"os": "windows-latest", "args": "", "target": "", "flavor": "host", "preset": ""}, {"os": "macos-14", "args": "--target aarch64-apple-darwin", "target": "aarch64-apple-darwin", "flavor": "host", "preset": ""}, {"os": "macos-14", "args": "--target x86_64-apple-darwin", "target": "x86_64-apple-darwin", "flavor": "host", "preset": ""}, {"os": "ubuntu-22.04", "args": "", "target": "", "flavor": "host", "preset": ""}, {"os": "windows-latest", "args": "", "target": "", "flavor": "imagegen", "preset": "presets/imagegen.json"}, {"os": "macos-14", "args": "--target aarch64-apple-darwin", "target": "aarch64-apple-darwin", "flavor": "imagegen", "preset": "presets/imagegen.json"}, {"os": "macos-14", "args": "--target x86_64-apple-darwin", "target": "x86_64-apple-darwin", "flavor": "imagegen", "preset": "presets/imagegen.json"}, {"os": "ubuntu-22.04", "args": "", "target": "", "flavor": "imagegen", "preset": "presets/imagegen.json"}, {"os": "windows-latest", "args": "", "target": "", "flavor": "musicgen", "preset": "presets/musicgen.json"}, {"os": "macos-14", "args": "--target aarch64-apple-darwin", "target": "aarch64-apple-darwin", "flavor": "musicgen", "preset": "presets/musicgen.json"}, {"os": "macos-14", "args": "--target x86_64-apple-darwin", "target": "x86_64-apple-darwin", "flavor": "musicgen", "preset": "presets/musicgen.json"}, {"os": "ubuntu-22.04", "args": "", "target": "", "flavor": "musicgen", "preset": "presets/musicgen.json"}, {"os": "windows-latest", "args": "", "target": "", "flavor": "chatgen", "preset": "presets/chatgen.json"}, {"os": "macos-14", "args": "--target aarch64-apple-darwin", "target": "aarch64-apple-darwin", "flavor": "chatgen", "preset": "presets/chatgen.json"}, {"os": "macos-14", "args": "--target x86_64-apple-darwin", "target": "x86_64-apple-darwin", "flavor": "chatgen", "preset": "presets/chatgen.json"}, {"os": "ubuntu-22.04", "args": "", "target": "", "flavor": "chatgen", "preset": "presets/chatgen.json"}, {"os": "windows-latest", "args": "", "target": "", "flavor": "codegen", "preset": "presets/codegen.json"}, {"os": "macos-14", "args": "--target aarch64-apple-darwin", "target": "aarch64-apple-darwin", "flavor": "codegen", "preset": "presets/codegen.json"}, {"os": "macos-14", "args": "--target x86_64-apple-darwin", "target": "x86_64-apple-darwin", "flavor": "codegen", "preset": "presets/codegen.json"}, {"os": "ubuntu-22.04", "args": "", "target": "", "flavor": "codegen", "preset": "presets/codegen.json"}]
          if os.environ.get('MAC') != 'true':
              rows = [r for r in rows if not r['os'].startswith('macos')]
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'include': rows}) + '\n')
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Linux packages
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Signing secrets (only those that are set; unsigned test builds otherwise)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<SUSHILA_EOF"; echo "${!v}"; echo "SUSHILA_EOF"; } >> "$GITHUB_ENV"; fi
          done
      - name: Product name for the flavor
        shell: bash
        working-directory: hoststation
        run: |
          if [ "${{ matrix.flavor }}" != host ]; then
            echo "SUSHILA_PRESET=${{ matrix.preset }}" >> "$GITHUB_ENV"
            (python3 -c "import json; p=json.load(open('${{ matrix.preset }}')); json.dump({'productName': p['product'], 'mainBinaryName': p['binary']}, open('flavor.conf.json','w'))" 2>/dev/null \
              || python -c "import json; p=json.load(open('${{ matrix.preset }}')); json.dump({'productName': p['product'], 'mainBinaryName': p['binary']}, open('flavor.conf.json','w'))")
            echo "TAURI_FLAVOR_ARGS=--config $GITHUB_WORKSPACE/hoststation/flavor.conf.json" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: hoststation
          args: ${{ matrix.args }} ${{ env.TAURI_FLAVOR_ARGS }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.os }}-${{ matrix.target }}
          path: |
            hoststation/src-tauri/target/**/release/bundle/**/*.msi
            hoststation/src-tauri/target/**/release/bundle/**/*.exe
            hoststation/src-tauri/target/**/release/bundle/**/*.dmg
            hoststation/src-tauri/target/**/release/bundle/**/*.deb
            hoststation/src-tauri/target/**/release/bundle/**/*.rpm
            hoststation/src-tauri/target/**/release/bundle/**/*.AppImage
  publish:
    # Uploads the installers to B2 hoststation/app/<version>/ and writes hoststation/app/LATEST.json, which sushila.ai's
    # install wizard and /hoststation page read. Publish only signed installers (see README). Secrets: B2_KEY_ID, B2_APP_KEY.
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Upload to B2 and write LATEST.json
        env: { B2_KEY_ID: "${{ secrets.B2_KEY_ID }}", B2_APP_KEY: "${{ secrets.B2_APP_KEY }}" }
        run: |
          python3 - <<'PYX'
          import hashlib, json, os, sys, time
          sys.path.insert(0, 'scripts/precompute'); import b2_save
          v = json.load(open('hoststation/src-tauri/tauri.conf.json'))['version']
          b2, files = b2_save.B2(), []
          kinds = [('-setup.exe', 'windows-x86_64', 'Windows'), ('aarch64.dmg', 'macos-aarch64', 'Mac (Apple M1-M4)'), ('x64.dmg', 'macos-x86_64', 'Mac (Intel)'),
                   ('.deb', 'linux-deb', 'Ubuntu / Debian'), ('.rpm', 'linux-rpm', 'Fedora'), ('.AppImage', 'linux-appimage', 'Other Linux')]
          for root, _, names in os.walk('dist'):
              for n in names:
                  kind = next((k for k in kinds if n.endswith(k[0])), None)
                  product = next((k for k, pre in (('imagegen', 'Sushila ImageGen'), ('musicgen', 'Sushila MusicGen'), ('chatgen', 'Sushila ChatGen'), ('codegen', 'Sushila CodeGen')) if n.startswith(pre)), 'host-station')
                  if not kind or any(f['platform'] == kind[1] and f['product'] == product for f in files):
                      continue
                  p = os.path.join(root, n)
                  b2.put_file(p, f'hoststation/app/{v}/{n}')
                  files.append({'product': product, 'platform': kind[1], 'label': {'imagegen': 'Sushila ImageGen for ', 'musicgen': 'Sushila MusicGen for ', 'chatgen': 'Sushila ChatGen for ', 'codegen': 'Sushila CodeGen for '}.get(product, '') + kind[2], 'file': n, 'bytes': os.path.getsize(p), 'sha256': hashlib.sha256(open(p, 'rb').read()).hexdigest()})
          b2.put('hoststation/app/LATEST.json', json.dumps({'version': v, 'built_utc': time.strftime('%Y-%m-%dT%H:%MZ', time.gmtime()), 'files': files}, indent=1).encode())
          print(json.dumps(files, indent=1))
          PYX
