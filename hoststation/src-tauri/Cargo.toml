[package]
name = "sushila-host-station"
version = "0.1.1"
description = "Sushila Host Station: installs Sushila.cpp and model packs, and serves the local inference page"
authors = ["Sushila, an open-source research project"]
license = "MIT"
edition = "2021"

[lib]
name = "sushila_host_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = "2"
flate2 = "1"
tar = "0.4"
axum = "0.7"
sysinfo = "0.32"
ed25519-dalek = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
